{% extends "admin/_layout.html" %}
{% block title %}Incluir fornecedor · Admin{% endblock %}
{% set active_tab = 'dashboard' %}
{% block admin_content %}
<div class="container-estreito">
  <div class="card">
    <h1 class="card-titulo">Incluir fornecedor</h1>
    <p class="card-subtitulo">Cadastro manual (normalmente o próprio fornecedor se cadastra pelo link público).</p>
    <form method="post">
      <div class="form-grupo">
        <label for="category_id">Categoria</label>
        <select id="category_id" name="category_id" required>
          <option value="">Selecione...</option>
          {% for c in categories %}
            <option value="{{ c['id'] }}">{{ c['name'] }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-grupo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>
      </div>
      <div class="form-grupo">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" required>
      </div>
      <div class="form-grupo">
        <label for="funcao">Função</label>
        <input type="text" id="funcao" name="funcao" required>
      </div>
      <div class="form-grupo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" required>
      </div>
      <div class="flex gap-8">
        <button type="submit" class="btn btn-primario">Salvar</button>
        <a class="btn btn-secundario" href="{{ url_for('admin.dashboard') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
