{% extends "base.html" %}
{% block nav %}
  <span>{{ current_admin['username'] }}</span>
  <a href="{{ url_for('admin.change_password') }}">Minha senha</a>
  <a href="{{ url_for('admin.logout') }}">Sair</a>
{% endblock %}

{% block content %}
<div class="flex gap-12 mt-0" style="margin-bottom: 20px; flex-wrap: wrap;">
  <a class="btn {{ 'btn-primario' if active_tab == 'dashboard' else 'btn-secundario' }} btn-sm"
     href="{{ url_for('admin.dashboard') }}">Fornecedores</a>
  <a class="btn {{ 'btn-primario' if active_tab == 'categorias' else 'btn-secundario' }} btn-sm"
     href="{{ url_for('admin.categories_list') }}">Categorias</a>
  <a class="btn {{ 'btn-primario' if active_tab == 'procedimentos' else 'btn-secundario' }} btn-sm"
     href="{{ url_for('admin.procedures_list') }}">ITs / POPs</a>
  <a class="btn {{ 'btn-primario' if active_tab == 'perguntas' else 'btn-secundario' }} btn-sm"
     href="{{ url_for('admin.questions_list') }}">Prova (perguntas)</a>
</div>
{% block admin_content %}{% endblock %}
{% endblock %}
